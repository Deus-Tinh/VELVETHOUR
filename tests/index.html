<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <title>Serenity Spa &amp; Wellness — Test Suite Runner</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f172a; color: #f8fafc; padding: 30px; }
    h1 { color: #38bdf8; font-size: 24px; margin-bottom: 20px; }
    .card { background: #1e293b; border-radius: 8px; padding: 20px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
    .test-item { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #334155; }
    .test-item:last-child { border-bottom: none; }
    .badge { padding: 4px 10px; border-radius: 4px; font-weight: 600; font-size: 13px; }
    .badge-pass { background: #059669; color: #fff; }
    .badge-fail { background: #dc2626; color: #fff; }
    .summary { margin-top: 20px; font-size: 18px; font-weight: bold; color: #10b981; }
    .badge { display: inline-block; }
    .failure-detail { color: #fecaca; margin: 6px 0 10px; white-space: pre-wrap; font-size: 13px; }
    .btn { background: #38bdf8; color: #0f172a; border: none; padding: 10px 20px; font-weight: bold; border-radius: 6px; cursor: pointer; margin-bottom: 20px; }
    .btn:hover { background: #7dd3fc; }
  </style>
</head>
<body>
  <h1>🧪 SERENITY SPA &amp; WELLNESS — AUTOMATED IN-BROWSER TEST SUITE</h1>
  <button class="btn" id="runBtn">Chạy lại toàn bộ kiểm thử</button>
  <div class="card">
    <div id="testList" aria-live="polite">Đang chạy kiểm thử...</div>
    <div class="summary" id="summary"></div>
  </div>
  <script type="module" src="./browserRunner.js"></script>
</body>
</html>
