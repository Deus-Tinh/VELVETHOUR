# Set DATABASE_URL in the Render dashboard to the internal URL of the PostgreSQL
# database populated from a verified SQLite backup before the first deploy.
services:
  - type: web
    name: serenity-api
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 24.22.1
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: SERENITY_PROXY_TOKEN
        generateValue: true
      - key: SERENITY_INITIAL_ADMIN_EMAIL
        sync: false
      - key: SERENITY_INITIAL_ADMIN_PASSWORD
        sync: false
      - key: SERENITY_INITIAL_ADMIN_NAME
        value: Demo Admin
      - key: VIETQR_DIRECT_ENABLED
        value: "true"
      - key: SEPAY_ENABLED
        value: "false"
      - key: SEPAY_BANK_NAME
        sync: false
      - key: SEPAY_ACCOUNT_NUMBER
        sync: false
      - key: SEPAY_ACCOUNT_HOLDER
        sync: false
      - key: SEPAY_WEBHOOK_API_KEY
        sync: false
      - key: AI_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false
      - key: AI_MODEL
        sync: false
