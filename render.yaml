# BLOCKED: server/server.js intentionally refuses production startup until the
# SQLite-to-PostgreSQL adapter and tested data migration are complete.
services:
  - type: web
    name: serenity-api
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 24.22.1
      - key: NODE_ENV
        value: production
      - key: SERENITY_ALLOW_EPHEMERAL_STORAGE
        value: "true"
      - key: SERENITY_PROXY_TOKEN
        generateValue: true
      - key: SERENITY_INITIAL_ADMIN_EMAIL
        value: admin@example.invalid
      - key: SERENITY_INITIAL_ADMIN_PASSWORD
        value: Tinh211006@
      - key: SERENITY_INITIAL_ADMIN_NAME
        value: Demo Admin
      - key: SEPAY_ENABLED
        value: "false"
      - key: SEPAY_BANK_NAME
        sync: false
      - key: SEPAY_ACCOUNT_NUMBER
        sync: false
      - key: SEPAY_ACCOUNT_HOLDER
        sync: false
      - key: SEPAY_WEBHOOK_API_KEY
        sync: false
      - key: AI_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false
      - key: AI_MODEL
        sync: false
